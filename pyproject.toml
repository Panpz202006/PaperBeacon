[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "literature-scout"
version = "0.1.0"
description = "PaperBeacon: local paper ranking and resilient daily research email digests"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Research Team"}]
dependencies = []

[project.scripts]
literature-scout = "literature_scout.cli:main"
scout = "literature_scout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
